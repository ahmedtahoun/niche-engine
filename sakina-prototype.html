<meta charset="utf-8">
<title>Sakina Marketplace Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control strip (view switcher + journey) above a stage. Customer & seller views sit in a phone frame with a notes column; admin is a full-width console. */
:root{
  --bg:#EDEFE9; --surface:#FFFFFF; --surface-2:#F6F5EF; --ink:#17201D; --muted:#5C6862; --line:#DADCD2;
  --emerald:#1F5C4A; --emerald-ink:#FFFFFF; --emerald-soft:#E0ECE5; --gold:#85662A; --sand:#EEE7DA; --frame:#151A18;
  --ok:#2C7A4D; --ok-soft:#E1F0E6; --warn:#9A620F; --warn-soft:#FAEED6; --bad:#B0372D; --bad-soft:#F7E0DC; --info:#2D5B88; --info-soft:#E0E9F3;
  --tg-bg:#D3E0CC; --tg-head:#4C789E; --tg-in:#FFFFFF; --tg-out:#E4F6D3; --tg-btn:rgba(255,255,255,.78); --tg-btn-ink:#285C84;
  --wa-bg:#E9E2D7; --wa-head:#0E6B59; --wa-in:#FFFFFF; --wa-out:#D8F6C3;
  --f-display:'El Messiri','IBM Plex Sans Arabic',Georgia,serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#161D1A; --surface-2:#1B231F; --ink:#E6EBE7; --muted:#97A39D; --line:#2A3530;
  --emerald:#53A98A; --emerald-ink:#0A1310; --emerald-soft:#1B3128; --gold:#D3B172; --sand:#232E29; --frame:#000000;
  --ok:#5DC28C; --ok-soft:#163323; --warn:#E3AA4C; --warn-soft:#3A2B11; --bad:#F07C70; --bad-soft:#3C1D1A; --info:#82B0E2; --info-soft:#19293A;
  --tg-bg:#0E1621; --tg-head:#17212B; --tg-in:#182533; --tg-out:#2B5278; --tg-btn:rgba(255,255,255,.08); --tg-btn-ink:#8CC4F2;
  --wa-bg:#0B141A; --wa-head:#1F2C34; --wa-in:#202C33; --wa-out:#005C4B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161D1A; --surface-2:#1B231F; --ink:#E6EBE7; --muted:#97A39D; --line:#2A3530;
  --emerald:#53A98A; --emerald-ink:#0A1310; --emerald-soft:#1B3128; --gold:#D3B172; --sand:#232E29; --frame:#000000;
  --ok:#5DC28C; --ok-soft:#163323; --warn:#E3AA4C; --warn-soft:#3A2B11; --bad:#F07C70; --bad-soft:#3C1D1A; --info:#82B0E2; --info-soft:#19293A;
  --tg-bg:#0E1621; --tg-head:#17212B; --tg-in:#182533; --tg-out:#2B5278; --tg-btn:rgba(255,255,255,.08); --tg-btn-ink:#8CC4F2;
  --wa-bg:#0B141A; --wa-head:#1F2C34; --wa-in:#202C33; --wa-out:#005C4B; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1280px;margin:0 auto}

/* top strip */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-size:26px;color:var(--emerald);font-weight:700}
.brand span{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--emerald);color:var(--emerald-ink)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}
.guide{margin-top:14px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:12.5px;max-width:260px;text-align:start}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);flex:0 0 auto}
.step.done{border-color:var(--ok);background:var(--ok-soft)} .step.done i{background:var(--ok);color:#fff;border-color:var(--ok)}
.step.next{border-color:var(--emerald)} .step.next i{background:var(--emerald);color:var(--emerald-ink);border-color:var(--emerald)}

/* stage */
.stage{margin-top:18px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start;justify-content:center}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.phone{width:min(390px,100%);height:780px;max-height:calc(100vh - 40px);min-height:600px;margin:0 auto;border:10px solid var(--frame);border-radius:42px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 18px 50px rgba(0,0,0,.12)}
.sbar{height:30px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;background:inherit}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.notes h3{margin:0 0 4px;font-size:16px}
.notes .kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes ul{margin:10px 0 0;padding-inline-start:18px;display:grid;gap:8px}
.notes li{line-height:1.55}
.notes pre{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--f-mono);font-size:11.5px;overflow:auto;max-height:280px;margin:14px 0 0;direction:ltr;text-align:left}
.chatswitch{display:flex;justify-content:center;margin-bottom:12px}

/* customer app */
.c{direction:rtl;display:flex;flex-direction:column;height:100%;min-height:0;background:var(--surface);flex:1}
.c-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.c-logo{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--emerald)}
.c-logo small{font-family:var(--f-body);font-size:10px;color:var(--muted);font-weight:500;margin-inline-start:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 13px;min-height:36px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center}
.chip.gold{border-color:var(--gold);color:var(--gold);background:transparent}
.c-scroll{flex:1;overflow-y:auto;min-height:0}
.c-pad{padding:14px 16px 20px;display:grid;gap:16px}
.hero{background:var(--emerald);color:var(--emerald-ink);border-radius:18px;padding:16px;display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.hero h2{font-family:var(--f-display);margin:2px 0 4px;font-size:22px;line-height:1.25}
.hero p{margin:0 0 8px;font-size:12.5px;opacity:.9}
.hero .art{background:rgba(255,255,255,.12);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.eyebrow{font-size:11px;font-weight:600;opacity:.85}
.price{display:flex;gap:8px;align-items:baseline}
.price b{font-size:18px} .price s{opacity:.7;font-size:12px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px}
.btn.primary{background:var(--emerald);color:var(--emerald-ink)}
.hero .btn.primary{background:var(--surface);color:var(--emerald);padding:8px 14px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:11px;text-align:center;line-height:1.35;display:grid;gap:4px;justify-items:center}
.trust svg{width:18px;height:18px;color:var(--emerald)}
.cats{display:flex;gap:8px;overflow-x:auto}
.cats .chip{flex:0 0 auto}
.sec{font-family:var(--f-display);font-size:18px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;text-align:start;display:grid;gap:3px}
.pimg{background:var(--sand);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.pimg svg{width:62%;height:62%}
.pname{font-weight:600;font-size:12.5px;line-height:1.35}
.pby{font-size:11px;color:var(--muted)}
.pprice{font-weight:700;color:var(--emerald)}
.learn{display:block;border:1px dashed var(--gold);border-radius:14px;padding:12px;background:transparent;text-align:start}
.learn b{display:block;font-size:14px} .learn span{font-size:12px;color:var(--muted)}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:4px}
.tabbar button{border:0;background:transparent;padding:9px 0 7px;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px;font-weight:600}
.tabbar button[aria-current="true"]{color:var(--emerald)}
.tabbar svg{width:20px;height:20px}
.back{border:0;background:transparent;font-weight:600;color:var(--emerald);padding:0}
.big-img{background:var(--sand);border-radius:16px;aspect-ratio:1/0.85;display:grid;place-items:center}
.big-img svg{width:52%;height:62%}
.ptitle{font-family:var(--f-display);font-size:21px;margin:0;line-height:1.3}
.by{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.verified{color:var(--ok);font-weight:700}
.lead{background:var(--emerald-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sz{min-width:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-weight:700;display:grid;justify-items:center;gap:0}
.sz small{font-weight:500;font-size:10px;color:var(--muted)}
.sz[aria-pressed="true"]{border-color:var(--emerald);background:var(--emerald-soft)}
.sz[disabled]{opacity:.4}
.spec{width:100%;border-collapse:collapse;font-size:12.5px}
.spec td{padding:7px 4px;border-bottom:1px solid var(--line)}
.spec td:first-child{color:var(--muted);width:40%}
.h4{font-weight:700;font-size:14px;margin:0 0 6px}
.rev{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:4px;font-size:12.5px}
.rev .meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;border-radius:6px;padding:1px 7px;background:var(--surface-2);border:1px solid var(--line)}
details{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}
summary{font-weight:600;cursor:pointer}
details p{margin:6px 0 0;color:var(--muted)}
.sticky{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.sticky .tot{font-weight:700;font-size:16px}
.part{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.part .pimg{border-radius:8px}
.part .pimg svg{width:70%;height:70%}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.row.total{font-weight:700;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.note{border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--info-soft);color:var(--info)}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.radio[aria-checked="true"]{border-color:var(--emerald);background:var(--emerald-soft)}
.radio b{display:block}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;border:1px solid var(--line);border-radius:12px;padding:10px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;border:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw[aria-checked="true"]{background:var(--emerald)}
.sw[aria-checked="true"]::after{inset-inline-start:21px}
.tl{display:grid;gap:0}
.tl div{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:14px;position:relative;font-size:13px}
.tl div::before{content:"";position:absolute;inset-inline-start:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl div:last-child::before{display:none}
.tl i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-style:normal;display:grid;place-items:center;font-size:11px}
.tl .on i{background:var(--emerald);border-color:var(--emerald);color:var(--emerald-ink)}
.tl small{display:block;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}

/* chat apps */
.chat{display:flex;flex-direction:column;height:100%;min-height:0;flex:1;direction:rtl}
.chat-head{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff}
.chat-head .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:rgba(255,255,255,.2);flex:0 0 auto}
.chat-head b{display:block;font-size:14px} .chat-head small{font-size:11px;opacity:.8}
.chat-body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{max-width:86%;border-radius:14px;padding:8px 11px;font-size:13px;line-height:1.55;white-space:pre-line;position:relative}
.msg.in{align-self:flex-start;border-start-start-radius:4px}
.msg.out{align-self:flex-end;border-start-end-radius:4px}
.msg time{display:block;text-align:end;font-size:10px;opacity:.6;margin-top:2px;white-space:normal}
.tg .chat-head{background:var(--tg-head)} .tg .chat-body{background:var(--tg-bg)}
.tg .msg.in{background:var(--tg-in)} .tg .msg.out{background:var(--tg-out)}
.wa .chat-head{background:var(--wa-head)} .wa .chat-body{background:var(--wa-bg)}
.wa .msg.in{background:var(--wa-in)} .wa .msg.out{background:var(--wa-out)}
.ibtns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px;max-width:86%;align-self:flex-start;width:86%}
.ibtns.one{grid-template-columns:1fr}
.ibtns button{border:0;border-radius:10px;padding:8px 6px;font-size:12.5px;font-weight:600;background:var(--tg-btn);color:var(--tg-btn-ink)}
.wa .ibtns button{background:var(--wa-in);color:var(--wa-head)}
:root[data-theme="dark"] .wa .ibtns button{color:#53BDA5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa .ibtns button{color:#53BDA5}}
.ibtns button[disabled]{opacity:.45;cursor:default}
.file{display:flex;gap:10px;align-items:center;white-space:normal}
.file .ic{width:38px;height:38px;border-radius:50%;background:var(--tg-head);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;white-space:normal;width:200px;max-width:100%}
.photos div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;background:var(--sand)}
.photos svg{width:70%;height:70%}
.pcardmsg{white-space:normal;display:grid;gap:6px}
.pcardmsg .pimg{aspect-ratio:16/9}
.pcardmsg .pimg svg{width:auto;height:70%}
.share{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;background:var(--surface-2);border-top:1px solid var(--line)}
.kb button{border:0;border-radius:8px;padding:9px 4px;background:var(--surface);font-size:12.5px;font-weight:600;box-shadow:0 1px 0 var(--line)}
.inputbar{display:flex;gap:8px;padding:8px;background:var(--surface);border-top:1px solid var(--line);align-items:center;font-size:12.5px;color:var(--muted)}
.inputbar span{flex:1;background:var(--surface-2);border-radius:18px;padding:8px 12px}

/* admin */
.admin{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:2px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:860px){.side{position:static;display:flex;overflow-x:auto}}
.side .niche{padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
@media (max-width:860px){.side .niche{display:none}}
.side .niche b{display:block;font-family:var(--f-display);font-size:18px;color:var(--emerald)}
.side .niche small{color:var(--muted)}
.side button{border:0;background:transparent;text-align:start;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.side button[aria-current="true"]{background:var(--emerald-soft);color:var(--emerald)}
.main{display:grid;gap:16px;min-width:0}
.main h2{margin:0;font-size:20px}
.main .sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi b{font-family:var(--f-mono);font-size:21px;font-weight:500;display:block;margin-top:2px}
.kpi span{font-size:11.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:1050px){.cols{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--surface-2)}
.t td.r,.t th.r{text-align:right}
.ar{direction:rtl;unicode-bidi:isolate;font-family:var(--f-body)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.mini.pri{background:var(--emerald);border-color:var(--emerald);color:var(--emerald-ink)}
.mini.danger{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}

const CATS=[['abaya','عبايات'],['niqab','نقاب'],['khimar','خمار'],['hijab','طرح'],['ihram','إحرام رجالي']];
const KIND_AR={abaya:'عبايه عبايات اسدال',niqab:'نقاب نقابات',khimar:'خمار خمارات',hijab:'طرحه طرح حجاب',ihram:'احرام رجالي'};
const POPULAR=['عباية عمرة','نقاب بالخمار','طرحة شيفون','عباية سوداء','إحرام رجالي'];
const SYN={'اسدال':'عبايه','حجاب':'طرحه','لفه':'طرحه','ايشارب':'طرحه','طقم':'شنطه'};

function searchTerms(){return norm(S.q).split(/\s+/).filter(Boolean).map(w=>SYN[w]||w)}
function searchHits(){
  const terms=searchTerms();
  return S.products.filter(p=>p.status==='live'&&SL(p.sid).status!=='suspended'&&(!S.cat||p.kind===S.cat)).filter(p=>{
    const hay=norm([p.name,p.fabric,KIND_AR[p.kind],SL(p.sid).name,p.lead].join(' '));
    return terms.every(w=>hay.includes(w)||hay.includes(w.replace(/^ال/,'')));
  });
}
function searchResults(){
  if(!S.q.trim()&&!S.cat) return `<div style="display:grid;gap:12px"><p class="h4" style="margin:0">الأكثر بحثاً</p><div class="cats" style="flex-wrap:wrap">${POPULAR.map(x=>`<button class="chip" data-act="sq" data-v="${x}">${x}</button>`).join('')}</div><p class="h4" style="margin:0">الأكثر طلباً قبل رمضان</p>${kitCard()}</div>`;

  const kit=(!S.cat||S.cat==='abaya')&&terms.some(w=>['عمره','شنطه','كامل','عبايه','عبايات','نقاب'].includes(w));
  if(!hits.length&&!kit) return `<div class="card" style="text-align:center;justify-items:center"><b>مش لاقيين "${esc(S.q)}"</b><span class="pby">جربي كلمة أبسط، أو اختاري من دول:</span><div class="cats" style="flex-wrap:wrap;justify-content:center">${POPULAR.slice(0,3).map(x=>`<button class="chip" data-act="sq" data-v="${x}">${x}</button>`).join('')}</div><button class="btn ghost" data-act="askwa">قوليلنا بتدوري على إيه على واتساب</button></div>`;

  return `<div style="display:grid;gap:10px">${ctrls}<p class="pby" style="margin:0">${shown.length} منتج${S.q.trim()?` لـ "${esc(S.q)}"`:''}${S.cat?` في ${CATS.find(c=>c[0]===S.cat)[1]}`:''}</p>${kit&&S.price!=='lt300'?kitCard():''}${shown.length?`<div class="grid">${shown.map(pcard).join('')}</div>`:`<span class="pby">مفيش منتجات في الرينج ده. <button class="back" data-act="pricef" data-v="${S.price}">شيلي فلتر السعر</button></span>`}</div>`;

  exopen:()=>{S.exch[S.lastOrderId]='pick'},
  exsize:d=>{const o=S.orders.find(x=>x.id===S.lastOrderId);const ab=o.items.find(i=>P(i.pid).kind==='abaya');S.exch[o.id]=d.k;
    if(ab.sid==='s1')bot('sara',`🔁 طلب استبدال #${o.id}\nمقاس ${d.k} بدل ${ab.size} (${P(ab.pid).name})\nالمندوب هيسلم المقاس الجديد وياخد القديم في نفس الزيارة. جهزي مقاس ${d.k} للاستلام بكرة.`,{btns:[['✅ جاهز','avail:'+ab.pid],['❌ المقاس خلص','pricesupd']]});
    toast('Exchange booked. The seller got a Telegram message to prepare the new size.',"Open Sara's Telegram",()=>{S.view='seller';S.tgChat='sara'})},
  ccancel:()=>{const o=S.orders.find(x=>x.id===S.lastOrderId);o.status='cancelled';toast('Order cancelled. No charge, and the seller is told automatically.')},
  nudge:d=>{S.nudged[d.v]=true;toast('One WhatsApp reminder sent with a link back to the filled-in checkout.')},
  noop:()=>{}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  if(el.classList.contains('drawer-bg')&&e.target!==el) { const inner=e.target.closest('[data-act]'); if(inner===el) return; }
  const fn=ACT[el.dataset.act]; if(!fn) return;
  const r=fn(el.dataset,el,e); if(r==='skip') return;
  if(!['toastgo','toastx','tg','kb','addcart','waconfirm','bosta','papprove','sapprove','paid','rconfirm','survey','place','askwa','exsize','ccancel','nudge','fav','login'].includes(el.dataset.act)&&S.toast&&el.dataset.act!=='noop'){S.toast=null}
  if(r!=='done') render();
});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;S.q=e.target.value;const r=document.getElementById('sres');if(r)r.innerHTML=searchResults();const x=document.querySelector('.sbox [data-act="clearq"]');if(x)x.hidden=!S.q});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.radio')){e.preventDefault();e.target.click()} if(e.key==='Escape'&&S.drawer){S.drawer=null;render()}});
document.addEventListener('change',e=>{
  if(e.target.id==='f-city'){S.cust.city=e.target.value;render();return}
  const k=e.target.dataset.cfg; if(!k) return; const v=parseFloat(e.target.value); if(isNaN(v)) return;
  if(['new','repeat','referral'].includes(k))CFG.rates[k]=v/100; else if(['reserve','cashback'].includes(k))CFG[k]=v/100; else CFG[k]=v;
  toast('Settings saved. Every number in the engine now uses the new value.'); render();
});
window.addEventListener('offline',()=>{S.offline=true;render()});window.addEventListener('online',()=>{S.offline=false;render()});
render();
</script>
