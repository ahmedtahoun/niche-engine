---
# cPanel "Git Version Control" runs these tasks on "Deploy HEAD Commit".
# This file lives on the `deploy` branch (copied there by GitHub Actions).
#
# The build goes into a fresh folder, then replaces `current/` in one move, so no
# file from an older build is left behind. It lives in a subfolder because cPanel's
# Node.js setup puts its own `node_modules` link in the application root.
# Node.js app: Application root = niche-engine-app, startup file = current/apps/web/server.js
deployment:
  tasks:
    - export APP=/home/viorowzb/niche-engine-app
    - /bin/rm -rf $APP/release-new
    - /bin/mkdir -p $APP/release-new $APP/tmp
    - /bin/cp -R ./apps ./packages ./niches ./node_modules ./package.json ./REVISION $APP/release-new/
    - /bin/rm -rf $APP/release-old
    - /bin/mv $APP/current $APP/release-old || true
    - /bin/mv $APP/release-new $APP/current
    - /bin/touch $APP/tmp/restart.txt
    # Photos, logos and build files also go into cairoroast.com's web folder: the web server
    # sends files that exist there itself (fast, cached), and asks the Node app for the rest.
    - export DOC=/home/viorowzb/cairoroast.com
    - /bin/mkdir -p $DOC/_next
    - /bin/cp -R ./apps/web/public/products ./apps/web/public/brands ./apps/web/public/sellers $DOC/
    - /bin/cp -R ./apps/web/.next/static $DOC/_next/
    - /bin/cp ./static.htaccess $DOC/products/.htaccess
    - /bin/cp ./static.htaccess $DOC/brands/.htaccess
    - /bin/cp ./static.htaccess $DOC/sellers/.htaccess
    - /bin/cp ./next-static.htaccess $DOC/_next/static/.htaccess
