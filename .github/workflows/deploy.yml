# On every push and pull request: run the tests, check the niche settings and make sure the
# Cloudflare build works. Deploying is done by Cloudflare Workers Builds (see DEPLOY-CLOUDFLARE.md),
# which builds and publishes main to cairoroast.com. The old cPanel `deploy` branch is no longer updated.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:niches
      - name: Cloudflare build
        run: npm run cf:build --workspace @niche-engine/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
