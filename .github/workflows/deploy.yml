# On every push and pull request: run the tests, check the niche settings and build for Cloudflare.
# On main only, it then publishes to Cloudflare (Worker "cairoroast", cairoroast.com).
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens, template "Edit Cloudflare Workers").
name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-main' || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:niches
      - name: Cloudflare build
        run: npm run cf:build --workspace @niche-engine/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Browser source maps go to Sentry during the build (skipped when the token is missing, e.g. on pull requests).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: apps/web
        run: |
          # Maps go to Sentry only: when Cloudflare also has them, it rewrites stack lines and Sentry can't match them.
          npx wrangler deploy --outdir dist --var "SENTRY_RELEASE:$GITHUB_SHA"
          # Server source maps: readable stack traces in Sentry for errors in the Worker.
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            npx sentry-cli releases new "$GITHUB_SHA"
            npx sentry-cli sourcemaps upload --release="$GITHUB_SHA" --strip-prefix 'dist/..' dist
            npx sentry-cli releases finalize "$GITHUB_SHA"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f5d12c07701edca8597825d6e4e929a
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: where-to-spot-ph
          SENTRY_PROJECT: cairo-roast
